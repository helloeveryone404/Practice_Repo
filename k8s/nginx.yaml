apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-practice
  labels:
    app: nginx-practice
  annotations:
    kubernetes.io/change-cause: "update: nginx 1.30.6-alpine"    # shown by `kubectl rollout history`
spec:
  replicas: 3
  revisionHistoryLimit: 5          # keep 5 old ReplicaSets so we can roll back
  selector:
    matchLabels:
      app: nginx-practice
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0            # never go below 3 ready pods during an update
      maxSurge: 1                  # allow at most 1 extra pod (4 total) during an update
  template:
    metadata:
      labels:
        app: nginx-practice
    spec:
      automountServiceAccountToken: false   # nginx never calls the Kubernetes API, so don't mount an API token
      containers:
        - name: nginx
          image: nginx:1.30.6-alpine
          ports:
            - containerPort: 80
          readinessProbe:          # only send traffic to the pod once nginx answers
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
              ephemeral-storage: 50Mi
            limits:
              memory: 64Mi
              ephemeral-storage: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-practice
  labels:
    app: nginx-practice
spec:
  type: ClusterIP                  # reachable only from inside the cluster
  selector:
    app: nginx-practice            # send traffic to pods with this label...
  ports:
    - port: 80                     # ...arriving on the Service's port 80
      targetPort: 80               # ...to port 80 in the pod
